name: 매일 아침 브리핑
run-name: ${{ inputs.dry_run && '브리핑 dry-run' || '브리핑 발송' }}

on:
  schedule:
    - cron: "30 22 * * *"         # UTC 22:30 = KST 07:30
    # GitHub 스케줄은 늦어지거나 빠질 수 있다 → 예비 시각 두 개. 그날 이미 보냈으면 run.py가 건너뛴다
    - cron: "50 22 * * *"         # 예비 · KST 07:50
    - cron: "10 23 * * *"         # 예비 · KST 08:10
  workflow_dispatch:              # 손으로도 돌릴 수 있게
    inputs:
      dry_run:
        description: "발송하지 않고 로그만 남기기"
        type: boolean
        default: false

# 07:30 실행이 밀려 07:50과 겹쳐도 하나씩만 돈다 — 뒤 실행은 앞 실행이 커밋한 sent.jsonl을 받아서 중복을 안다
concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write                 # 보낸 주소(store/)와 사본(issues/)을 저장소에 커밋한다

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20           # 멈춰 있는 실행을 20분에서 끊는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테스트 (실제 API·네트워크는 막혀 있음)
        run: pip install pytest && python -m pytest -q
      - name: 브리핑 만들고 보내기
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:                      # 비밀값은 여기로만 들어간다
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - name: 실행 기록 커밋
        # 발송이 실패해도, dry-run이어도 metrics는 남긴다 (실패·dry-run 기록도 지표)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store issues
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "기록: $(TZ=Asia/Seoul date +%Y-%m-%d) 브리핑"
          git push
